<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindspot: how many YC companies does the AI know?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #FBFBFA; --ink: #1A1D24; --quiet: #5F6676; --line: #DDE0E5; --bar: #3434E6; --warn: #A64B12; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Archivo", system-ui, sans-serif; line-height: 1.5; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 28px 70px; }
  a { color: inherit; text-underline-offset: 2px; }
  :focus-visible { outline: 3px solid var(--bar); outline-offset: 2px; }
  .back { font-size: 14px; color: var(--quiet); }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 900; font-stretch: 120%; margin: 14px 0 8px; max-width: 24ch; }
  .sub { color: var(--quiet); max-width: 68ch; margin: 0 0 24px; }
  .banner { border-left: 4px solid var(--warn); background: #FBF1EA; padding: 10px 14px; margin: 0 0 18px; display: none; }
  .row { display: grid; grid-template-columns: 1fr 230px; gap: 34px; align-items: start; }
  .chart { position: relative; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .tick { font-size: 12px; fill: var(--quiet); }
  .tip {
    position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; display: none; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(26, 29, 36, .08);
  }
  .hero b { display: block; font-size: 60px; line-height: 1; font-weight: 900; font-stretch: 125%; }
  .hero p { margin: 8px 0 0; color: var(--quiet); font-size: 15px; }
  details { margin: 26px 0 0; font-size: 14px; }
  summary { cursor: pointer; color: var(--quiet); }
  table { border-collapse: collapse; margin: 10px 0 0; width: 100%; max-width: 520px; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .how { margin: 30px 0 0; font-size: 14px; color: var(--quiet); max-width: 72ch; }
  .empty { padding: 40px 0; color: var(--quiet); }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">Back to Blindspot</a>
  <h1>How many YC companies does the AI actually know?</h1>
  <p class="sub" id="sub">Share of randomly sampled Y Combinator companies the model can correctly describe from memory, by batch year.</p>
  <div class="banner" id="banner"></div>
  <div id="body"><p class="empty">Loading...</p></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function chart(d) {
  const W = 680, H = 340, L = 44, R = 10, T = 16, B = 34;
  const years = d.per_year;
  const step = (W - L - R) / years.length;
  const bw = Math.min(36, step * 0.6);
  const y = (pct) => T + (H - T - B) * (1 - pct / 100);
  let g = "";
  for (const t of [0, 25, 50, 75, 100]) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#E6E8EC" stroke-width="1"/>`;
    g += `<text class="tick" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}%</text>`;
  }
  years.forEach((p, i) => {
    const cx = L + step * i + step / 2;
    const top = y(p.pct), base = y(0), h = Math.max(0, base - top);
    const r = Math.min(4, h);
    const path = h > 0
      ? `M${cx - bw / 2},${base} V${top + r} Q${cx - bw / 2},${top} ${cx - bw / 2 + r},${top} H${cx + bw / 2 - r} Q${cx + bw / 2},${top} ${cx + bw / 2},${top + r} V${base} Z`
      : "";
    g += `<g class="bar" tabindex="0" data-i="${i}" aria-label="${p.year}: ${p.known} of ${p.n} known, ${p.pct} percent">
      <rect x="${cx - step / 2}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent"/>
      ${path ? `<path d="${path}" fill="var(--bar)"/>` : `<line x1="${cx - bw / 2}" x2="${cx + bw / 2}" y1="${base}" y2="${base}" stroke="var(--bar)" stroke-width="2"/>`}
      <text class="tick" x="${cx}" y="${H - B + 20}" text-anchor="middle">${p.year}</text>
    </g>`;
  });
  if (d.cutoff) {
    const i = years.findIndex((p) => p.year === d.cutoff);
    if (i >= 0) {
      const x = L + step * i + step;
      g += `<line x1="${x}" x2="${x}" y1="${T - 6}" y2="${H - B}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
      g += `<text class="tick" x="${x - 6}" y="${T + 4}" text-anchor="end" style="fill: var(--ink)">Model training cutoff (${d.cutoff})</text>`;
    }
  }
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of the share of YC companies the model knows, by batch year">${g}</svg>`;
}

function render(d) {
  if (d.mode === "mock") {
    $("banner").style.display = "block";
    $("banner").textContent = "Sample numbers, not measured. Add an LLM key to .env and run: python yc_curve.py";
  }
  $("sub").textContent = `Share of randomly sampled Y Combinator companies that ${d.model} can correctly describe from memory, by batch year. Measured ${d.measured_at}.`;
  const total = d.per_year.reduce((a, p) => [a[0] + p.known, a[1] + p.n], [0, 0]);
  const f = d.famous;
  $("body").innerHTML = `
    <div class="row">
      <div class="chart" id="chart">${chart(d)}<div class="tip" id="tip"></div></div>
      <div>
        <div class="hero"><b>${f.pct}%</b><p>of YC's famous companies (${f.known} of ${f.n}, from YC's own top-companies list) it knows</p></div>
        <div class="hero" style="margin-top:26px"><b>${total[1] ? Math.round(100 * total[0] / total[1]) : 0}%</b><p>of ordinary YC companies it knows (${total[0]} of ${total[1]})</p></div>
      </div>
    </div>
    <details><summary>Table view</summary>
      <table><thead><tr><th>Batch year</th><th>Known</th><th>Sampled</th><th>Share</th></tr></thead><tbody>
      ${d.per_year.map((p) => `<tr><td>${p.year}</td><td>${p.known}</td><td>${p.n}</td><td>${p.pct}%</td></tr>`).join("")}
      </tbody></table>
    </details>
    <details><summary>Every company and the model's answer</summary>
      <table style="max-width:none"><thead><tr><th>Company</th><th>Batch</th><th>Model said</th><th>YC says</th><th>Correct</th></tr></thead><tbody>
      ${d.rows.map((r) => `<tr><td>${esc(r.name)}${r.top_company ? " (top)" : ""}</td><td>${esc(r.batch)}</td><td>${esc(r.guess)}</td><td>${esc(r.one_liner)}</td><td>${r.correct ? "Yes" : "No"}</td></tr>`).join("")}
      </tbody></table>
    </details>
    <p class="how">Method: about 30 companies per batch year, drawn at random from YC's public directory with a fixed seed. The model is asked with no search what each one does, and may answer UNKNOWN. A second call checks each answer against YC's own one-liner. Famous companies come from YC's top-companies list and are counted separately.${d.failed ? ` ${d.failed} companies were skipped because a call failed.` : ""}</p>`;

  const tip = $("tip"), box = $("chart");
  const show = (el, ev) => {
    const p = d.per_year[+el.dataset.i];
    tip.innerHTML = `<b>${p.year}</b>: ${p.known} of ${p.n} known (${p.pct}%)`;
    tip.style.display = "block";
    const r = box.getBoundingClientRect(), b = el.getBoundingClientRect();
    tip.style.left = `${Math.min(r.width - 160, Math.max(0, b.left - r.left + b.width / 2 - 70))}px`;
    tip.style.top = `${Math.max(0, b.top - r.top + 10)}px`;
  };
  box.querySelectorAll(".bar").forEach((el) => {
    el.addEventListener("mouseenter", (ev) => show(el, ev));
    el.addEventListener("focus", (ev) => show(el, ev));
    el.addEventListener("mouseleave", () => (tip.style.display = "none"));
    el.addEventListener("blur", () => (tip.style.display = "none"));
  });
}

fetch("/api/curve").then(async (r) => {
  const d = await r.json();
  if (!r.ok) { $("body").innerHTML = `<p class="empty">${esc(d.error)}</p>`; return; }
  render(d);
}).catch(() => { $("body").innerHTML = `<p class="empty">Could not reach the server.</p>`; });
</script>
</body>
</html>
